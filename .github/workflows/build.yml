name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          # Мы убираем встроенный кэш setup-java и используем специализированный ниже

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          # Это включит кэширование зависимостей, нод и локального кеша Gradle
          cache-read-only: false 

      - name: build
        # Добавляем флаги для ускорения в CI:
        # --no-daemon (в CI демон не нужен), --parallel (параллельная сборка)
        run: ./gradlew build --no-daemon --parallel

      - name: Get diff stats
        id: diff
        if: always()
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            if [ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD^..HEAD"
            fi
          fi
          STATS=$(git diff --stat $RANGE || echo "No stats available")
          echo "stats<<EOF" >> $GITHUB_OUTPUT
          echo "$STATS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: send telegram notification
        uses: appleboy/telegram-action@master
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message_thread_id: 5 # Хардкод ID темы "Кодовая"
          format: markdown
          message: |
            ${{ job.status == 'success' && '✅ *BUILD SUCCESS*' || '❌ *BUILD FAILED*' }}
            
            👤 *Pusher:* ${{ github.actor }}
            🌿 *Branch:* `${{ github.ref_name }}`
            📝 *Commit:* [${{ github.sha }}](${{ github.event.compare }})
            
            *Changed Files:*
            ```text
            ${{ steps.diff.outputs.stats }}
            ```