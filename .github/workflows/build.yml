name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup jdk
        id: setup_jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Setup Gradle
        id: setup_gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: build
        id: build_step
        # 2>&1 | tee build.log — записывает всё (и ошибки) в файл и выводит в консоль
        run: ./gradlew build --no-daemon --parallel 2>&1 | tee build.log

      - name: Get diff stats
        id: diff
        if: always()
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            if [ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD^..HEAD"
            fi
          fi
          STATS=$(git diff --stat $RANGE || echo "No stats available")
          echo "stats<<EOF" >> $GITHUB_OUTPUT
          echo "$STATS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram Notification
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_TO }}
          THREAD_ID: 5
          MEMBERS: "@DaniilSivakov @Sultanchik @Raidler"
          # Учитываем статус отмены (cancelled)
          RAW_STATUS: ${{ job.status }}
          PUSHER: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_URL: "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
        run: |
          # 1. Формируем красивый заголовок статуса
          if [[ "$RAW_STATUS" == "success" ]]; then
            STATUS="✅ *BUILD SUCCESS*"
          elif [[ "$RAW_STATUS" == "cancelled" ]]; then
            STATUS="⏹️ *BUILD CANCELLED*"
          else
            STATUS="❌ *BUILD FAILED*"
          fi

          # 2. Определяем стадию (ищем либо failure, либо то, что было прервано/cancelled)
          FAILED_STAGE="None"
          if [[ "${{ steps.setup_jdk.conclusion }}" == "failure" || "${{ steps.setup_jdk.conclusion }}" == "cancelled" ]]; then FAILED_STAGE="JDK Setup"; fi
          if [[ "${{ steps.setup_gradle.conclusion }}" == "failure" || "${{ steps.setup_gradle.conclusion }}" == "cancelled" ]]; then FAILED_STAGE="Gradle Setup"; fi
          if [[ "${{ steps.build_step.conclusion }}" == "failure" || "${{ steps.build_step.conclusion }}" == "cancelled" ]]; then FAILED_STAGE="Build/Tests"; fi
          
          # 3. Формируем блок логов (для отмены тоже полезно увидеть, на чем всё встало)
          ERROR_SECTION=""
          if [[ "$RAW_STATUS" != "success" && -f build.log ]]; then
            ERROR_DETAILS=$(tail -n 20 build.log)
            if [[ -n "$ERROR_DETAILS" ]]; then
              TITLE=$([[ "$RAW_STATUS" == "cancelled" ]] && echo "⚠️ *Last Log before Cancel:*" || echo "🚨 *Error Log (last lines):*")
              ERROR_SECTION="$TITLE
          \`\`\`text
          $ERROR_DETAILS
          \`\`\`"
            fi
          fi

          # 4. Текст коммита
          COMMIT_TEXT=$(git log -1 --pretty=format:"%s%n%b")
          
          # 5. Сборка сообщения
          TEXT=$(cat <<EOF
          $STATUS

          📍 *Stage:* $FAILED_STAGE
          👤 *Pusher:* $PUSHER
          🌿 *Branch:* \`$BRANCH\`

          📝 *Commit Message:*
          \`\`\`text
          $COMMIT_TEXT
          \`\`\`

          🔗 [View on GitHub]($COMMIT_URL)

          $ERROR_SECTION

          🔔 *Attention:* $MEMBERS

          *File Changes:*
          \`\`\`text
          ${{ steps.diff.outputs.stats }}
          \`\`\`
          EOF
          )
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "message_thread_id=$THREAD_ID" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$TEXT"