name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          # Мы убираем встроенный кэш setup-java и используем специализированный ниже

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          # Это включит кэширование зависимостей, нод и локального кеша Gradle
          cache-read-only: false 

      - name: build
        # Добавляем флаги для ускорения в CI:
        # --no-daemon (в CI демон не нужен), --parallel (параллельная сборка)
        run: ./gradlew build --no-daemon --parallel

      - name: Get diff stats
        id: diff
        if: always()
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            if [ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD^..HEAD"
            fi
          fi
          STATS=$(git diff --stat $RANGE || echo "No stats available")
          echo "stats<<EOF" >> $GITHUB_OUTPUT
          echo "$STATS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram Notification
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_TO }}
          THREAD_ID: 5
          MEMBERS: "@DaniilSivakov @Sultanchik @Raidler"
          STATUS: ${{ job.status == 'success' && '✅ *BUILD SUCCESS*' || '❌ *BUILD FAILED*' }}
          PUSHER: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_URL: "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          STATS: ${{ steps.diff.outputs.stats }}
        run: |
          # Получаем текст последнего коммита (%s - тема, %b - тело)
          COMMIT_TEXT=$(git log -1 --pretty=format:"%s%n%b")
          
          # Формируем текст сообщения
          TEXT=$(cat <<EOF
          $STATUS
          👤 *Pusher:* $PUSHER
          🌿 *Branch:* \`$BRANCH\`
          
          📝 *Commit Message:*
          \`\`\`text
          $COMMIT_TEXT
          \`\`\`
          
          🔗 [View on GitHub]($COMMIT_URL)
          
          🔔 *Attention:* $MEMBERS

          *File Changes:*
          \`\`\`text
          $STATS
          \`\`\`
          EOF
          )
          
          # Отправка
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "message_thread_id=$THREAD_ID" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$TEXT"